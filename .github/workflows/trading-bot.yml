name: Ciclo diario del trading bot

# Corre después del cierre de NYSE (16:00 ET). 21:35 UTC da margen para que
# se asienten los datos de fin de día y cubre tanto horario estándar como de
# verano de EE.UU. sin ajustes manuales. Nota: el `schedule` de GitHub
# Actions puede retrasarse varios minutos respecto a la hora exacta del cron
# (a veces bastante más en horas de carga alta); para una estrategia diaria
# esto es irrelevante.
on:
  schedule:
    - cron: "35 21 * * 1-5" # Lunes a viernes, 21:35 UTC
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # necesario para commitear/pushear state.json y equity_history.csv

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el ciclo diario del bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m tradingbot.main

      - name: Commitear y pushear el estado actualizado
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add state.json equity_history.csv 2>/dev/null || true
          if [ -f HALT ]; then
            git add HALT
          fi

          if git diff --cached --quiet; then
            echo "Sin cambios de estado para commitear."
          else
            git commit -m "Actualiza estado del bot [skip ci]"
            git push
          fi
