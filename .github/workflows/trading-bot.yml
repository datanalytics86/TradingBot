name: Ciclo diario del trading bot

# Corre después del cierre de NYSE (16:00 ET). 21:35 UTC da margen para que
# se asienten los datos de fin de día.
on:
  schedule:
    - cron: "35 21 * * 1-5"
  workflow_dispatch:

# Evita ejecuciones solapadas si el runner anterior tarda o se re-dispara el workflow.
concurrency:
  group: trading-bot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el ciclo diario del bot
        id: bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m tradingbot.main
        continue-on-error: true

      - name: Generar dashboard web
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 -m tradingbot.dashboard

      - name: Notificar fallo por Telegram
        if: steps.bot.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python3 -c "
          import json, os, urllib.request
          msg = 'TradingBot: el ciclo diario FALLÓ en GitHub Actions. Revisa los logs.'
          if os.path.exists('last_run.json'):
              with open('last_run.json') as f:
                  data = json.load(f)
              errs = data.get('errors', [])
              if errs:
                  msg += '\nErrores: ' + ', '.join(e['symbol'] for e in errs)
          payload = json.dumps({'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': msg}).encode()
          req = urllib.request.Request(
              f\"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage\",
              data=payload, headers={'Content-Type': 'application/json'}, method='POST')
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception:
              pass
          "

      - name: Commitear y pushear el estado actualizado
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add state.json equity_history.csv last_run.json docs/index.html 2>/dev/null || true
          if [ -f HALT ]; then
            git add HALT
          fi

          if git diff --cached --quiet; then
            echo "Sin cambios de estado para commitear."
          else
            git commit -m "Actualiza estado del bot [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi

      - name: Notificar fallo de push de estado
        if: failure() && steps.bot.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python3 -c "
          import json, os, urllib.request
          msg = 'TradingBot: el ciclo OK pero fallo el push de state.json a GitHub. Revisa permisos del workflow.'
          payload = json.dumps({'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': msg}).encode()
          req = urllib.request.Request(
              f\"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage\",
              data=payload, headers={'Content-Type': 'application/json'}, method='POST')
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception:
              pass
          "

      - name: Fallar el job si el bot falló
        if: steps.bot.outcome == 'failure'
        run: exit 1